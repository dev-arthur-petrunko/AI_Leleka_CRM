<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Leleka CRM — Замовлення</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="assets/api.js"></script>
<style>
  :root { --tg-bg:#e7ebef; --tg-card:#fff; --tg-text:#17212b; --tg-hint:#707579;
    --tg-link:#3390ec; --tg-btn:#3390ec; --tg-btn-text:#fff; --tg-header:#17212b; --tg-sep:#dfe2e5; }
  @media (prefers-color-scheme: dark) { :root { --tg-bg:#0e1621; --tg-card:#17212b; --tg-text:#fff;
    --tg-hint:#7f91a4; --tg-link:#6ab2f2; --tg-btn:#2b5278; --tg-header:#17212b; --tg-sep:#242f3d; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Roboto',sans-serif; background:var(--tg-bg); color:var(--tg-text); padding-bottom:76px; }
  header { background:var(--tg-header); color:#fff; padding:16px 24px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:19px; }
  main { padding:16px; max-width:900px; margin:0 auto; }
  .filters { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  select, .search { border:1px solid var(--tg-sep); border-radius:10px; background:var(--tg-card);
    color:var(--tg-text); font-size:14px; padding:10px 12px; outline:none; }
  .search { flex:1; min-width:140px; }
  .card { background:var(--tg-card); border-radius:12px; padding:6px 16px; }
  .row { display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid var(--tg-sep); font-size:14px; }
  .row:last-child { border:none; }
  .st { font-size:11px; font-weight:700; border-radius:12px; padding:2px 9px; color:#fff; background:var(--tg-link); }
  .amt { margin-left:auto; font-weight:800; white-space:nowrap; }
  .pager { display:flex; gap:8px; margin-top:10px; }
  .tg-btn { border:none; border-radius:10px; background:var(--tg-btn); color:var(--tg-btn-text);
    font-size:14px; font-weight:600; padding:10px 18px; cursor:pointer; }
  .empty { text-align:center; color:var(--tg-hint); padding:26px; font-size:14px; line-height:1.8; }
  .skel { border-radius:8px; color:transparent !important; background:var(--tg-sep) !important; }
  .tabbar { position:fixed; bottom:0; left:0; right:0; background:var(--tg-card);
    border-top:1px solid var(--tg-sep); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  .tab { flex:1; text-align:center; padding:8px 0 9px; font-size:10.5px; color:var(--tg-hint); text-decoration:none; }
  .tab .ico { font-size:22px; display:block; } .tab.active { color:var(--tg-link); font-weight:600; }
</style>
</head>
<body>
<header><button onclick="history.length>1?history.back():location='dashboard.html'" style="background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer" title="Назад">←</button><h1>🧾 Замовлення</h1></header>
<main>
  <div class="filters">
    <select id="fStatus"><option value="">всі статуси</option><option>new</option><option>confirmed</option><option>packed</option><option>shipped</option><option>delivered</option><option>cancelled</option><option>returned</option></select>
    <select id="fSource"><option value="">всі джерела</option><option>prom</option><option>rozetka</option><option>site</option><option>manual</option></select>
    <input class="search" id="fq" placeholder="🔍 номер…">
  </div>
  <div class="card"><div id="list"><div class="skel">завантаження…</div></div></div>
  <div class="pager"><button class="tg-btn" id="prev">←</button><button class="tg-btn" id="next">→</button></div>
  <div class="empty" id="empty" hidden>Порожньо. <a href="feedhub.html" style="color:var(--tg-link)">Підключіть Prom</a>, щоб зʼявились замовлення.</div>
</main>
<nav class="tabbar" id="tabs">
  <a class="tab" href="dashboard.html"><span class="ico">📊</span>Дашборд</a>
  <a class="tab active" href="orders.html"><span class="ico">🧾</span>Замовлення</a>
  <a class="tab" href="inbox.html"><span class="ico">💬</span>Вхідні</a>
  <a class="tab" href="clients.html"><span class="ico">👥</span>Клієнти</a>
  <a class="tab" href="more.html"><span class="ico">⚙️</span>Ще</a>
</nav>
<script>
  (function(){const tg=window.Telegram&&window.Telegram.WebApp;if(!tg)return;tg.ready();tg.expand();})();
  let page = 0; const LIM = 20;
  async function load(){
    const box = document.getElementById('list');
    const q = `?limit=${LIM}&offset=${page*LIM}` +
      (document.getElementById('fStatus').value ? `&status=${document.getElementById('fStatus').value}` : '') +
      (document.getElementById('fSource').value ? `&source=${document.getElementById('fSource').value}` : '') +
      (document.getElementById('fq').value ? `&q=${encodeURIComponent(document.getElementById('fq').value)}` : '');
    const r = await api('/orders' + q);
    if (!r || !r.ok) {
      box.innerHTML = '<div class="empty">Немає звʼязку з сервером. <a href="#" onclick="load();return false" style="color:var(--tg-link)">Повторити</a></div>';
      return;
    }
    const items = r.data.items;
    document.getElementById('empty').hidden = items.length > 0;
    box.innerHTML = items.map(o =>
      `<div class="row"><b>${o.order_number || o.external_id}</b><span class="st">${o.status}</span><span>${o.source}</span><span class="amt">${Math.round(o.total)} ${o.currency}</span></div>`
    ).join('') || '';
    document.getElementById('prev').disabled = page === 0;
    document.getElementById('next').disabled = (page + 1) * LIM >= r.data.total;
  }
  document.getElementById('fStatus').onchange = () => { page = 0; load(); };
  document.getElementById('fSource').onchange = () => { page = 0; load(); };
  document.getElementById('fq').oninput = () => { page = 0; load(); };
  document.getElementById('prev').onclick = () => { page--; load(); };
  document.getElementById('next').onclick = () => { page++; load(); };
  load();
</script>
</body>
</html>
