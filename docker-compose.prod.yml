name: postgres
image: postgres:16
environment:
  POSTGRES_USER: ${DB_USER:?}
  POSTGRES_PASSWORD: ${DB_PASSWORD:?}
  POSTGRES_DB: ${DB_NAME:?}
volumes:
  - pgdata:/var/lib/postgresql/data
networks:
  - crm

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crm
    # порти НЕ публікуємо — БД доступна лише всередині мережі Docker
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    networks:
      - crm
  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:?}:${DB_PASSWORD:?}@db:5432/${DB_NAME:?}
      SECRET_KEY: ${SECRET_KEY:?}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:?}:${DB_PASSWORD:?}@db:5432/${DB_NAME:?}
      SECRET_KEY: ${SECRET_KEY:?}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - crm
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:?}:${DB_PASSWORD:?}@db:5432/${DB_NAME:?}
      SECRET_KEY: ${SECRET_KEY:?}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - crm
  # HTTPS: розкоментуйте caddy з вашим доменом (DNS має вказувати сюди)
  # caddy:
  #   image: caddy:2-alpine
  #   ports: ["80:80", "443:443"]
  #   volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
  #   networks: [crm]

volumes:
  pgdata:
  # caddy_data:

networks:
  crm:
