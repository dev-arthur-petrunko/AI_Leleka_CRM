services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leleka
      POSTGRES_PASSWORD: leleka
      POSTGRES_DB: leleka_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leleka -d leleka_crm"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: ./backend
    # Спочатку миграції (Alembic — джерело правди для схеми), тільки потім API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://leleka:leleka@db:5432/leleka_crm
      # Секрети ТІЛЬКИ з .env (див. backend/.env.example). Дефолтів у репозиторії нема —
      # старе значення було публічним і вважається скомпрометованим.
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY у .env (openssl rand -hex 32)}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?Задайте CREDENTIALS_KEY у .env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  pgdata:
